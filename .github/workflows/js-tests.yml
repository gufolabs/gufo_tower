name: Run JS Tests

on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "scripts/**"
      - "src/ui/**"
      - ".github/workflows/js-tests.yml"
    branches:
      - master

  pull_request:
    branches:
      - master
    paths:
      - "package.json"
      - "eslint.config.mjs"
      - "scripts/build-ui.mjs"
      - "src/ui/**"
      - ".github/workflows/js-tests.yml"

permissions:
  contents: read

jobs:
  js-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build UI
        run: npm run build
