name: Run Tests
env:
  PIP_CACHE_DIR: .pip
  PYTHONPATH: src
on:
  push:
    paths:
      - ".github/workflows/py-tests.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "setup.cfg"
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: ["published"]
permissions:
  contents: read
  pull-requests: write
jobs:
  py-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set Up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: |
          uv export \
            --extra lint \
            --format requirements-txt \
            --no-hashes \
            > requirements.txt
          uv pip install --system -r requirements.txt

      - name: Check Formatting
        run: ruff format --check src/ tests/

      - name: Check ruff
        run: ruff check -q src/ tests/

      # - name: Check Mypy
      #   run: mypy --strict src/

  test-coverage:
    runs-on: ubuntu-24.04
    needs: py-lint
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set Up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: |
          uv export \
            --extra test \
            --format requirements-txt \
            --no-hashes \
            > requirements.txt
          uv pip install --system -r requirements.txt

      - name: Run Tests
        run: pytest -v --cov --cov-branch --cov-report=xml tests/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    runs-on: ubuntu-24.04
    needs: [test-coverage]
    strategy:
      fail-fast: true
      matrix:
        # Run on all supported versions
        python-version: ["3.9"]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set Up Python {{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Build
        run: uv pip install --system build

      - name: Install Dependencies
        run: |
          uv export \
            --extra test \
            --format requirements-txt \
            --no-hashes \
            > requirements.txt
          uv pip install --system -r requirements.txt

      - name: Run Tests
        run: pytest -v tests/

  publish:
    runs-on: ubuntu-24.04
    needs: test
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set Up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build Package
        run: python -m build --sdist --wheel

      - name: Publish distribution 📦 to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
