stages:
  - build
  - build_image

build_tgz:
  stage: build
  image: python:2.7.11-alpine
  script:
    - apk add --update py-pep8 py-setuptools
    - pep8 --ignore=E265,E266,E501,E402 .
    - python setup.py sdist --format=bztar
  artifacts:
    paths:
      - dist/*
  after_script:
    - env |sort
  tags:
    - dind
  cache:
    key: "$CI_BUILD_NAME"
    untracked: true
  
build_image:
  image: docker:git
  services:
  - docker:dind
  stage: build_image
  script:
   - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com
   - docker build -t registry.gitlab.com/nocproject/tower:latest .
   - docker push registry.gitlab.com/nocproject/tower
  dependencies:
  - build_tgz
  tags:
    - dind
  cache:
    key: "$CI_BUILD_NAME"
    untracked: true