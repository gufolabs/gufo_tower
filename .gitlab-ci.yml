variables:
  PROXY: http://192.168.60.21:3128
  S3_BASE: https://s3.getnoc.com
  S3_BUCKET: tower

stages:
  - lint
  - build
  - upload
  - build_image

flake8:
  stage: lint
  image: registry.getnoc.com/infrastructure/noc-lint:master
  script:
    - flake8 tower/
  tags:
    - docker
  except:
    - master
    - tags

build_tgz:
  stage: build
  image: python:2.7-alpine
  before_script:
    - export VERSION=$(cat VERSION)
    - if [ -d dist ]; then  rm -R dist/*.zip; fi
  script:
    - python setup.py sdist --format=zip
  artifacts:
    paths:
      - dist/*.zip
  tags:
    - docker

upload:
  stage: upload
  image: registry.getnoc.com/infrastructure/s3helper:master
  script:
    - export VERSION=$(cat VERSION)
    - export FNAME=noc-tower-${VERSION}.zip
    - /tmp/mc -q cp dist/$FNAME cdn/$S3_BUCKET/noc-tower-master.zip
    - if [ -n "${CI_BUILD_TAG}" ]; then /tmp/mc -q cp dist/$FNAME cdn/$S3_BUCKET/noc-tower-${VERSION}.zip; fi
    - if [ -n "${CI_BUILD_TAG}" ]; then /tmp/mc -q cp dist/$FNAME cdn/$S3_BUCKET/noc-tower-latest.zip; fi
  dependencies:
    - build_tgz
  tags:
    - docker
  only:
    - master
    - tags

build_image_debian:
  stage: build
  before_script:
    - export VERSION=$(cat VERSION)
    - export CONTAINER_NAME=${CI_REGISTRY_IMAGE}:${CI_BUILD_REF_NAME}
  script:
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY
    - docker build --build-arg="http_proxy=$PROXY" --build-arg="https_proxy=$PROXY" --build-arg=VERSION=${VERSION} -t $CONTAINER_NAME .
    - docker push $CONTAINER_NAME
    - if [ -n "${CI_BUILD_TAG}" ]; then docker tag $CONTAINER_NAME ${CI_REGISTRY_IMAGE}:${CI_BUILD_TAG}; docker push $CI_REGISTRY_IMAGE:${CI_BUILD_TAG}; fi
    - if [ -n "${CI_BUILD_TAG}" ]; then docker tag $CONTAINER_NAME ${CI_REGISTRY_IMAGE}:latest; docker push ${CI_REGISTRY_IMAGE}:latest; fi
  tags:
    - shell
  only:
    - master
    - tags

build_image_alpine:
  stage: build
  before_script:
    - export VERSION=$(cat VERSION)
    - export CONTAINER_NAME=${CI_REGISTRY_IMAGE}:${CI_BUILD_REF_NAME}_alpine
  script:
    - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN $CI_REGISTRY
    - docker build --build-arg="http_proxy=$PROXY" --build-arg="https_proxy=$PROXY" --build-arg=VERSION=${VERSION} -t $CONTAINER_NAME  -f Dockerfile.alpine .
    - docker push $CONTAINER_NAME
    - if [ -n "${CI_BUILD_TAG}" ]; then docker tag $CONTAINER_NAME ${CI_REGISTRY_IMAGE}:${CI_BUILD_TAG}_alpine; docker push $CI_REGISTRY_IMAGE:${CI_BUILD_TAG}_alpine; fi
    - if [ -n "${CI_BUILD_TAG}" ]; then docker tag $CONTAINER_NAME ${CI_REGISTRY_IMAGE}:alpine; docker push ${CI_REGISTRY_IMAGE}:alpine; fi
  tags:
    - shell
  only:
    - master
    - tags