stages:
  - build
  - build_image

build_tgz:
  stage: build
  image: python:2.7.11-alpine
  before_script:
    - export VERSION=$(cat VERSION)
    - env |sort
    - if [ -d dist ]; then  rm -R dist/*.zip; fi
  script:
    - apk add --update py-pep8 py-setuptools
    - pep8 --ignore=E265,E266,E501,E402 .
    - python setup.py sdist --format=zip
  artifacts:
    paths:
      - dist/*.zip
  after_script:
    - env |sort
  tags:
    - dind

build_image:
  image: docker:git
  services:
  - docker:dind
  stage: build_image
  before_script:
    - export VERSION=$(cat VERSION)
    - env |sort
  script:
   - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com
   - docker build --build-arg="http_proxy=http://192.168.60.21:3128" --build-arg="https_proxy=http://192.168.60.21:3128" --build-arg="VERSION=${VERSION}" -t registry.gitlab.com/nocproject/tower:${VERSION} .
   - docker push registry.gitlab.com/nocproject/tower:${VERSION}
   - docker tag registry.gitlab.com/nocproject/tower:${VERSION} registry.gitlab.com/nocproject/tower:latest
   - docker push registry.gitlab.com/nocproject/tower:latest
  dependencies:
  - build_tgz
  tags:
    - dind