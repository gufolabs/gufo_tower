stages:
  - build
  - build_image

build_tgz:
  stage: build
  image: python:2.7.11-alpine
  script:
    - apk add --update py-pep8 py-setuptools
    - pep8 --ignore=E265,E266,E501,E402 .
    - python setup.py sdist --format=bztar
  artifacts:
    paths:
      - dist/*
  after_script:
    - env |sort
  tags:
    - dind
  cache:
    key: "$CI_BUILD_NAME"
    untracked: true
  
build_image:
  image: docker:git
  services:
  - docker:dind
  stage: build_image
  script:
   - mount 
   - find / -name noc-tower-0.1a51.tar.bz2
   - docker build -t nocproject/tower:latest .
  dependencies:
  - build_tgz
  tags:
    - dind
  cache:
    key: "$CI_BUILD_NAME"
    untracked: true