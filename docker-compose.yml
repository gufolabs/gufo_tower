version: '2.1'
services:
  tower:
    image: registry.getnoc.com/noc/tower:master_alpine
    restart: always
    hostname: TEST-TOWER
    ports:
      - "8888:8888"
    volumes:
      - "/opt/tower/var:/opt/tower/var/"
      #see for details https://groups.google.com/forum/#!topic/ansible-project/y8ohlv_dRi4
      - "$PWD/root:/root"
      # use it for development purpose
#      - "$PWD/tower:/opt/tower/lib/python2.7/site-packages/tower/"
#      - "$PWD/entrypoint-alpine.sh:/entrypoint.sh"
#      - "$PWD/requirements.txt:/opt/tower/requirements.txt"
#      - "$PWD/var/db:/opt/tower/var/tower//db"
    environment:
#      PROMETHEUS_ENABLED: "True"
#      INFLUXDB_ENABLED: "False"
      HISTCONTROL: "ignoreboth:erasedups"
#      MONGO_VERSION: 3.4
#      POSTGRES_VERSION: 9.6
