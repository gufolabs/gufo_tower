version: '2.1'
services:
  tower:
    image: registry.getnoc.com/noc/tower:master_alpine
    restart: always
    ports:
      - "8889:8888"
    volumes:
      - "$PWD/config:/opt/tower/var"
      - $PWD/tower:/opt/tower/lib/python2.7/site-packages/tower
    environment:
      HISTCONTROL: "ignoreboth:erasedups"
