[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=82",
  "wheel",
]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING", # Disable type-checking imports
  "@(abc\\.)?abstract", # Ignore abstract methods
  "@overload", # Ignore overloads
  "\\.\\.\\.\\s*$", # Ignore stub functions
]
include = ["src/*"]

[tool.coverage.run]
branch = false
omit = ["*tests*", "*examples*"]

[tool.coverage.html]
directory = "dist/coverage"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [".git", "build", "dist"]
line-length = 79
# Assume Python 3.9
target-version = "py39"
# Always autofix, but never try to fix `F401` (unused imports).
fix = true

[tool.ruff.lint]
ignore = [
  "D203",
  "D212",
  "D107", # Legacy errors to fix
  "ANN001", # 185 - Missing type annotation for function argument `expected`
  "ANN002", # 14 - Missing type annotation for `*args`
  "ANN003", # 13 - Missing type annotation for `**kwargs`
  "ANN201", # 173 - Missing return type annotation for public function `test_me`
  "ANN206", # 13 - Missing return type annotation for classmethod `authenticate`
  "ANN202", # 7 - Missing return type annotation for private function `dfs_visit`
  "ANN204", # 3 - Missing return type annotation for special method `__init__`
  "ANN205", # 2 - Missing return type annotation for staticmethod `name_config`
  "PT006", # 1 - Wrong type passed to first argument of `pytest.mark.parametrize`; expected `tuple`
  "RET504", # 2 - Unnecessary assignment to `order` before `return` statement
  "C416", # 2 -  Unnecessary list comprehension (rewrite using `list()`)
  "D415", # 30 - First line should end with a period, question mark, or exclamation point
  "D205", # 1 blank line required between summary line and description
  "D102", # 93 - Missing docstring in public method
  "D106", # 30 - Missing docstring in public nested class
  "D100", # 77 - Missing docstring in public module
  "D101", # 43 - Missing docstring in public class
  "D103", # 63 - Missing docstring in public function
  "D200", # 7 - One-line docstring should fit on one line
  "B904", # 11 - Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
  "RUF012", # 1 - Mutable default value for class attribute
  "PLC0415", # 20 - `import` should be at the top-level of a file
  "C901", # 6 - C901 `get_execution_order` is too complex (22 > 10)
  "E501", # 5 - Line too long (91 > 79)
  "UP031", # 54 - Use format specifiers instead of percent format
  "S324", # 1 - Probable use of insecure hash functions in `hashlib`: `sha1`
  "S603", # 5 - `subprocess` call: check for execution of untrusted input
  "S607", # 3 - Starting a process with a partial executable path
  "SIM115", # 2 - Use a context manager for opening files
  "RET503", # 1 - Missing explicit `return` at the end of function able to return non-`None` value
  "E712", # 6 - Avoid equality comparisons to `True`; use `Role.is_enabled:` for truth checks
  "SIM105", # 5 - Use `contextlib.suppress(ValueError, KeyError)` instead of `try`-`except`-`pass`
  "C414", # 1 - Unnecessary `list()` call within `sorted()`
  "C401", # 2 - Unnecessary generator (rewrite as a set comprehension)
  "PLR0915", #3 -  Too many statements (68 > 50)
  "SIM102", # Use a single `if` statement instead of nested `if` statements
  "PLR0912", # 5 - Too many branches (26 > 12)
  "PLR2004", # 13 - Magic value used in comparison, consider replacing `2` with a constant variable
  "PIE794", # 1 - Class field `config` is defined multiple times  
  "S506", # 1 - Probable use of unsafe loader `OrderedLoader` with `yaml.load`. Allows instantiation of arbitrary objects. Consider `yaml.safe_load`.
  "PLW1508", # 1 - Invalid type for environment variable default; expected `str` or `None`
  "A001", # 3 - Variable `hash` is shadowing a Python builtin
  "EM101", # 7 - Exception must not use a string literal, assign to variable first
  "PLW2901", # 1 - `for` loop variable `f` overwritten by `with` statement target
  "BLE001", # 1 - Do not catch blind exception: `Exception`
  "E721", # 2 - Use `is` and `is not` for type comparisons, or `isinstance()` for isinstance checks
  "A002", # Function argument `format` is shadowing a Python builtin
  "PLW0602", # 4 - Using global for `SERVICES` but no assignment is done
  "S108", # 2 - Probable insecure usage of temporary file or directory: "/tmp/${USER}/ansible"
  "C403", # 1 - Unnecessary list comprehension (rewrite as a set comprehension)
]
# Enable
select = [
  "E", # Pycodestyle Error
  "F", # Pyflakes
  "W", # Pycodestyle Warning
  "C90", # mccabe
  "I", # isort
  "D", # Pydocstyle
  "YTT", # flake8-2020
  "ANN", # flake8-annotations
  "S", # flake8-bandit
  "BLE", # flake8-blind-except
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "C4", # flake8-comprehensions 
  "EM", # flake8-errmsg
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "PT", # flake8-pytest-style
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "PLC", # pylint
  "PLE", # pylint
  "PLR", # pylint
  "PLW", # pylint
  "PIE", # flake8-pie
  "RUF", # ruff specific
  "UP", # pyupdate
]
unfixable = ["F401"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files
"__init__.py" = ["E402", "D104"]
"examples/*.py" = [
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103", # Missing docstring in public function
  "D104", # Missing docstring in public package
  "ANN101", # Missing type annotation for `self` in method
]
"tests/*.py" = [
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103", # Missing docstring in public function
  "D104", # Missing docstring in public package
  "E501", # Line too long
  "S101", # Use of assert detected
  "S603", # `subprocess` call: check for execution of untrusted input
  "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
  "PT011", # pytest.raises(ValueError)` is too broad, set the `match` parameter or use a more specific exception
]
[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src"]
strict = true
warn_unused_ignores = false

[project]
authors = [{name = "Gufo Labs"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "pyparsing==2.2.0",
  "bcrypt==3.1.4",
  "certifi>=2016.9.26",
  "paramiko==2.1.2",
  "cffi>=0.8.5",
  "peewee==2.10.2",
  "pycparser>=2.10",
  "singledispatch>=3.4.0.0",
  "tornado==5.1.1",
  "ansible==2.9.26",
  "setuptools>=11.3",
  "packaging",
  "appdirs",
  "netaddr",
  "jmespath==0.9.3",
  "future==0.18.2",
  "cryptography>=3,<3.4",
  "ruamel.yaml==0.17.21",
]
description = "A web-based control plane for managing NOC cluster topology, node assignments, and service configuration."
dynamic = ["version"]
keywords = [
  "noc",
  "network-management",
  "control-plane",
  "cluster-management",
  "service-orchestration",
  "infrastructure",
  "deployment",
]
license = {file = "LICENSE.md"}
name = "gufo_tower"
requires-python = ">=3.9"

[project.optional-dependencies]
docs = [
  "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav==0.6.2",
  "mkdocs-material==9.6.11",
  "mkdocs-section-index==0.3.10",
  "mkdocstrings[python]==0.29.1",
]
ipython = [
  "ipython==8.18",
]
lint = [
  "mypy==1.19",
  "ruff==0.15.20",
  "types-PyYAML==6.0.12.3",
]
test = [
  "PyYAML>=6.0",
  "pytest-benchmark==5.1.0",
  "pytest-cov==7.0.0",
  "pytest==8.4.2",
]

[project.readme]
content-type = "text/markdown"
file = "README.md"

[project.scripts]
tower-deploy = "gufo.tower.cli.deploy:main"
tower-dump = "gufo.tower.cli.backup:dump"
tower-inv = "gufo.tower.cli.inv:main"
tower-joblog = "gufo.tower.cli.joblog:main"
tower-pull = "gufo.tower.cli.pull:main"
tower-restore = "gufo.tower.cli.backup:restore"
tower-web = "gufo.tower.daemons.web:run"

[project.urls]
"Bug Tracker" = "https://github.com/gufolabs/gufo_tower/issues"
Changelog = "https://github.com/gufolabs/gufo_tower/blob/master/CHANGELOG.md"
Documentation = "https://docs.gufolabs.com/gufo_tower/"
Homepage = "https://github.com/gufolabs/gufo_tower/"
"Source Code" = "https://github.com/gufolabs/gufo_tower/"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gufo.tower.__version__"}
